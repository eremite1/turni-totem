name: Turni per Casa Nerola

# Manda tutti i turni (anche quelli cambiati) a Home Assistant
# su un canale ntfy privato. Gira ogni 3 ore: ntfy conserva
# l'ultimo messaggio per 12 ore, cosi' la casa lo trova sempre.

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turni-casa
  cancel-in-progress: true

jobs:
  invia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa librerie
        run: pip install requests beautifulsoup4

      - name: Leggi i turni e mandali alla casa
        env:
          TOTEM_UTENTE: ${{ secrets.TOTEM_UTENTE }}
          TOTEM_PASSWORD: ${{ secrets.TOTEM_PASSWORD }}
          NTFY_TOPIC_CASA: ${{ secrets.NTFY_TOPIC_CASA }}
        run: python turni_casa.py
